<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Calculator iOS 26</title>
<link rel="stylesheet" href="themes.css">
<script src="theme.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cell: 56px;
    --cell-w: 56px;
    --sci-cell: 38px;
    --sci-cell-w: 38px;
    --result-fz: 56px;
    --expr-fz: 22px;
    --gap: 10px;
    --sci-gap: 6px;
    --radius: 26px;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    background: transparent !important;
    color: var(--text);
    user-select: none;
  }

  /* основной контейнер-«стекло» — рисует скруглённый прямоугольник; всё что вне него прозрачно (transparent: true в окне) */
  .app-shell {
    position: fixed; inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background-color: var(--app-base);
    background-image: var(--app-bg);
    /* inset highlights для эффекта фаски + тонкая внешняя тень */
    box-shadow:
      inset 0 0 0 1px rgb(var(--ink) / 0.18),
      inset 0 1px 0 rgb(var(--ink) / 0.35),
      inset 0 -1px 0 rgba(0,0,0,0.35);
  }
  /* кольцо-фаска чтобы скругление было визуально подчёркнуто */
  .app-shell::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 0 0.5px rgb(var(--ink) / 0.25),
      inset 0 0 12px rgb(var(--ink) / 0.06);
    z-index: 250;
  }

  /* окно перетаскивается за header, кнопки и интерактивные элементы — нет */
  .drag { -webkit-app-region: drag; }
  .no-drag { -webkit-app-region: no-drag; }

  /* отдельная drag-зона — занимает ТОЛЬКО левую часть top-bar, НЕ перекрывая win-controls */
  .drag-zone {
    position: absolute;
    top: 0; left: 0;
    height: 38px;
    /* справа резерв 80px под win-controls (10 right + 26+6+26 ширина + 12 запас) */
    right: 80px;
    -webkit-app-region: drag;
    z-index: 1;
  }

  .calc {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 8px 10px 14px;
  }

  /* системные кнопки (свернуть / закрыть) — поверх всего */
  .win-controls {
    position: absolute;
    top: 8px; right: 10px;
    display: flex; gap: 6px;
    z-index: 1000;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }
  .win-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 0.5px solid rgb(var(--ink) / 0.18);
    background: rgb(var(--ink) / 0.12);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
    transition: background 0.15s ease;
    -webkit-app-region: no-drag;
    pointer-events: auto;
    padding: 0;
    outline: none;
  }
  .win-btn svg { pointer-events: none; }
  .win-btn:hover { background: rgb(var(--ink) / 0.22); }
  .win-btn.close:hover { background: rgba(255, 80, 80, 0.85); }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 10px 4px 14px;
    height: 38px;
    flex-shrink: 0;
    /* отступ справа чтобы не наезжать на оконные кнопки */
    padding-right: 80px;
    position: relative;
    z-index: 5;
    /* НЕ drag — drag-зона в отдельном .drag-zone элементе */
  }
  .header .title { font-size: 16px; font-weight: 600; opacity: 0.95; }
  .header .menu-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgb(var(--ink) / 0.15);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 0.5px solid rgb(var(--ink) / 0.2);
  }

  .display {
    flex: 1;
    min-height: var(--min-display, 140px);
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: flex-end;
    padding: 0 16px 6px;
    overflow: hidden;
  }
  .calc.scientific .display { min-height: var(--min-display, 110px); }
  .expression {
    font-size: var(--expr-fz);
    font-weight: 300; opacity: 0.65;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    margin-bottom: 2px; min-height: 1.2em; line-height: 1.2;
    text-align: right;
    flex-shrink: 0;
  }
  .expression::-webkit-scrollbar { display: none; }
  .result {
    font-size: var(--result-fz);
    font-weight: 300; line-height: 1.05;
    letter-spacing: -1.5px;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
    flex-shrink: 0;
  }
  .result::-webkit-scrollbar { display: none; }
  /* курсор-«хваталка» когда контент длиннее видимой области */
  .scrollable-x.overflowing { cursor: grab; }
  .scrollable-x.overflowing.dragging { cursor: grabbing; }
  .result.small { font-size: calc(var(--result-fz) * 0.78); }
  .result.tiny  { font-size: calc(var(--result-fz) * 0.62); }

  .sci-toggle {
    margin: 0 10px 6px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 18px;
    background: rgb(var(--ink) / 0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgb(var(--ink) / 0.12);
    font-size: 12px; font-weight: 500; opacity: 0.85;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sci-toggle .arrow { display: inline-block; margin-left: 6px; transition: transform 0.3s; }
  .calc.scientific .sci-toggle .arrow { transform: rotate(180deg); }

  .scientific-pad {
    display: none;
    grid-template-columns: repeat(5, var(--sci-cell-w));
    grid-auto-rows: var(--sci-cell);
    gap: var(--sci-gap);
    justify-content: center;
    padding: 0 10px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .calc.scientific .scientific-pad { display: grid; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, var(--cell-w));
    grid-auto-rows: var(--cell);
    gap: var(--gap);
    justify-content: center;
    padding: 0 10px;
    flex-shrink: 0;
  }

  .btn {
    width: 100%; height: 100%;
    /* круг, если ячейка квадратная, и капсула, если шире (app.js, fit) */
    border-radius: 999px;
    border: 0.5px solid rgb(var(--ink) / 0.18);
    font-size: calc(var(--cell) * 0.42);
    font-weight: 400;
    color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s ease, background 0.15s ease, filter 0.15s ease;
    position: relative;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    background: rgb(var(--key-rgb) / 0.55);
    box-shadow:
      inset 0 1px 0 rgb(var(--ink) / 0.18),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 1px 2px rgba(0,0,0,0.2);
    padding: 0;
  }
  .btn:active { transform: scale(0.94); filter: brightness(1.3); }

  .btn.func {
    background: rgb(var(--util-rgb) / 0.62);
    color: var(--util-text);
    font-weight: 500;
  }
  .btn.func:active { background: rgb(var(--util-rgb) / 0.9); }

  .btn.op {
    background: var(--accent-grad);
    color: var(--on-accent); font-size: calc(var(--cell) * 0.5);
    font-weight: 400;
  }
  .btn.op.active {
    background: var(--text); color: var(--accent);
  }
  .btn.op:active { filter: brightness(1.2); }

  .scientific-pad .btn {
    font-size: calc(var(--sci-cell) * 0.36);
    font-weight: 400;
    background: rgb(var(--key-rgb) / 0.4);
  }
  .scientific-pad .btn.active2nd { background: rgb(var(--accent-rgb) / 0.7); color: var(--on-accent); }

  .sup { font-size: 0.65em; vertical-align: super; }
  .sub { font-size: 0.65em; vertical-align: sub; }

  .menu-popover {
    position: absolute; top: 44px; right: 14px;
    width: 200px; padding: 6px;
    background: rgb(var(--key-rgb) / 0.92);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgb(var(--ink) / 0.18);
    border-radius: 14px; z-index: 200;
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .menu-popover.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .menu-item {
    padding: 10px 12px; border-radius: 8px;
    font-size: 15px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .menu-item:hover { background: rgb(var(--ink) / 0.08); }
  .menu-item .check { opacity: 0; }
  .menu-item.active .check { opacity: 1; }

  /* ===== ПАНЕЛЬ ИСТОРИИ ===== */
  .history-panel {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    background-color: var(--app-base);
    background-image: var(--app-bg);
    z-index: 400;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .history-panel.open { display: flex; }
  .history-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    /* отступ справа от win-controls */
    padding-right: 80px;
    height: 46px;
    flex-shrink: 0;
    border-bottom: 0.5px solid rgb(var(--ink) / 0.08);
  }
  .history-panel-title { font-size: 17px; font-weight: 600; }
  .history-back-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgb(var(--ink) / 0.12);
    border: 0.5px solid rgb(var(--ink) / 0.18);
    color: var(--text); font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .history-back-btn:hover { background: rgb(var(--ink) / 0.22); }
  .history-clear-btn {
    background: transparent;
    border: none;
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .history-clear-btn:hover { background: rgb(var(--accent-rgb) / 0.15); }
  .history-clear-btn:disabled { opacity: 0.35; cursor: default; }
  .history-clear-btn:disabled:hover { background: transparent; }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 14px 14px;
  }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb { background: rgb(var(--ink) / 0.15); border-radius: 3px; }
  .history-item {
    padding: 12px 10px;
    border-bottom: 0.5px solid rgb(var(--ink) / 0.08);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 4px;
    transition: background 0.12s ease;
    border-radius: 8px;
  }
  .history-item:hover { background: rgb(var(--ink) / 0.06); }
  .history-item:active { background: rgb(var(--ink) / 0.12); }
  .history-item .h-expr {
    font-size: 14px; opacity: 0.55;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
  }
  .history-item .h-result {
    font-size: 26px; font-weight: 300;
    letter-spacing: -0.5px;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
  }
  .history-item .h-expr::-webkit-scrollbar,
  .history-item .h-result::-webkit-scrollbar { display: none; }
  .history-empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.4;
    font-size: 15px;
    padding: 30px;
    text-align: center;
  }

  /* ===== Темы в меню: группа под обычными пунктами ===== */
  .menu-sep { height: 0.5px; margin: 6px 8px; background: var(--glass-border); }
  .menu-title { padding: 4px 12px 2px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); }
  .menu-item.theme-item { padding: 8px 12px; font-size: 14px; }
</style>
</head>
<body>

<div class="app-shell">

<div class="win-controls no-drag">
  <button type="button" class="win-btn" id="winMin" title="Свернуть">
    <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <button type="button" class="win-btn close" id="winClose" title="Закрыть">
    <svg width="10" height="10" viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
</div>

<div class="calc" id="calc">
  <div class="drag-zone"></div>
  <div class="header">
    <div class="title">Калькулятор</div>
    <div class="menu-btn no-drag" id="menuBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
        <circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="11" cy="7" r="1.3"/>
      </svg>
    </div>
  </div>

  <div class="menu-popover no-drag" id="menu">
    <div class="menu-item active" data-mode="basic">
      <span>Основной</span>
      <span class="check">✓</span>
    </div>
    <div class="menu-item" data-mode="scientific">
      <span>Научный</span>
      <span class="check">✓</span>
    </div>
    <div class="menu-item" data-action="history">
      <span>История</span>
      <span style="opacity:0.5">›</span>
    </div>
    <div class="menu-sep"></div>
    <div class="menu-title">Тема</div>
    <div id="themeItems"></div>
  </div>

  <div class="display no-drag">
    <div class="expression scrollable-x" id="expression"></div>
    <div class="result scrollable-x" id="result">0</div>
  </div>

  <div class="sci-toggle no-drag" id="sciToggle">
    <span id="sciToggleText">Научные функции</span>
    <span class="arrow">▼</span>
  </div>

  <div class="scientific-pad no-drag" id="sciPad">
    <button class="btn" data-act="sinh">sinh</button>
    <button class="btn" data-act="cosh">cosh</button>
    <button class="btn" data-act="mc">mc</button>
    <button class="btn" data-act="m+">m+</button>
    <button class="btn" data-act="m-">m-</button>

    <button class="btn" data-act="2nd" id="btn2nd">2<span class="sup">nd</span></button>
    <button class="btn" data-act="square">x<span class="sup">2</span></button>
    <button class="btn" data-act="cube">x<span class="sup">3</span></button>
    <button class="btn" data-act="pow">x<span class="sup">y</span></button>
    <button class="btn" data-act="exp">e<span class="sup">x</span></button>

    <button class="btn" data-act="ten-pow">10<span class="sup">x</span></button>
    <button class="btn" data-act="recip">1/x</button>
    <button class="btn" data-act="sqrt">²√x</button>
    <button class="btn" data-act="cbrt">³√x</button>
    <button class="btn" data-act="ln">ln</button>

    <button class="btn" data-act="log10">log<span class="sub">10</span></button>
    <button class="btn" data-act="fact">x!</button>
    <button class="btn" data-act="sin" id="btnSin">sin</button>
    <button class="btn" data-act="cos" id="btnCos">cos</button>
    <button class="btn" data-act="tan" id="btnTan">tan</button>

    <button class="btn" data-act="rad" id="btnRad">Rad</button>
    <button class="btn" data-act="pi">π</button>
    <button class="btn" data-act="e">e</button>
    <button class="btn" data-act="rand">Rand</button>
    <button class="btn" data-act="mr">mr</button>
  </div>

  <div class="keypad no-drag" id="keypad">
    <button class="btn func" data-act="back">⌫</button>
    <button class="btn func" data-act="clear" id="clearBtn">AC</button>
    <button class="btn func" data-act="percent">%</button>
    <button class="btn op" data-op="/">÷</button>

    <button class="btn" data-num="7">7</button>
    <button class="btn" data-num="8">8</button>
    <button class="btn" data-num="9">9</button>
    <button class="btn op" data-op="*">×</button>

    <button class="btn" data-num="4">4</button>
    <button class="btn" data-num="5">5</button>
    <button class="btn" data-num="6">6</button>
    <button class="btn op" data-op="-">−</button>

    <button class="btn" data-num="1">1</button>
    <button class="btn" data-num="2">2</button>
    <button class="btn" data-num="3">3</button>
    <button class="btn op" data-op="+">+</button>

    <button class="btn func" data-act="negate">+/−</button>
    <button class="btn" data-num="0">0</button>
    <button class="btn" data-num=".">,</button>
    <button class="btn op" data-op="=">=</button>
  </div>
</div>

<div class="history-panel" id="historyPanel">
  <div class="history-panel-header">
    <button type="button" class="history-back-btn no-drag" id="historyBack" title="Назад">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,2 3,7 9,12"/></svg>
    </button>
    <div class="history-panel-title">История</div>
    <button type="button" class="history-clear-btn no-drag" id="historyClear">Очистить</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

</div><!-- /.app-shell -->

<script src="calc-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
