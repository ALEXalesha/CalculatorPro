<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    background: #000;
  }

  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 20% 10%, #ff6b9d 0%, transparent 35%),
      radial-gradient(circle at 80% 20%, #4facfe 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, #ff9a56 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #a78bfa 0%, transparent 35%),
      #1a0a2e;
    background-attachment: fixed;
  }

  .phone {
    width: 390px; height: 844px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 390 844'><defs><radialGradient id='g1' cx='25%25' cy='15%25' r='40%25'><stop offset='0' stop-color='%23ff5e8a'/><stop offset='1' stop-color='%23ff5e8a' stop-opacity='0'/></radialGradient><radialGradient id='g2' cx='80%25' cy='25%25' r='45%25'><stop offset='0' stop-color='%234facfe'/><stop offset='1' stop-color='%234facfe' stop-opacity='0'/></radialGradient><radialGradient id='g3' cx='50%25' cy='75%25' r='50%25'><stop offset='0' stop-color='%23ff9a3c'/><stop offset='1' stop-color='%23ff9a3c' stop-opacity='0'/></radialGradient><radialGradient id='g4' cx='85%25' cy='90%25' r='40%25'><stop offset='0' stop-color='%23a78bfa'/><stop offset='1' stop-color='%23a78bfa' stop-opacity='0'/></radialGradient></defs><rect width='100%25' height='100%25' fill='%231a0a2e'/><rect width='100%25' height='100%25' fill='url(%23g1)'/><rect width='100%25' height='100%25' fill='url(%23g2)'/><rect width='100%25' height='100%25' fill='url(%23g3)'/><rect width='100%25' height='100%25' fill='url(%23g4)'/></svg>") center/cover;
    border-radius: 55px;
    position: relative; overflow: hidden;
    box-shadow: 0 0 0 3px #1a1a1a, 0 30px 80px rgba(0,0,0,0.6);
  }

  .notch {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 36px; background: #000; border-radius: 18px; z-index: 100;
  }

  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 50px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px 0; color: #fff; font-size: 16px; font-weight: 600;
    z-index: 50; pointer-events: none;
  }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }
  .status-bar svg { width: 18px; height: 12px; }

  .calc {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 56px 12px 24px;
    color: #fff;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 4px; height: 44px;
  }
  .header .title { font-size: 17px; font-weight: 600; opacity: 0.95; }
  .header .menu-btn {
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; border: 0.5px solid rgba(255,255,255,0.2);
  }

  .display {
    flex: 1; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: flex-end;
    padding: 0 24px 12px; min-height: 0; overflow: hidden;
  }
  .expression {
    font-size: 22px; font-weight: 300; opacity: 0.65;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    margin-bottom: 6px; min-height: 28px;
    text-align: right;
  }
  .expression::-webkit-scrollbar { display: none; }
  .result {
    font-size: 56px; font-weight: 300; line-height: 1.05;
    letter-spacing: -1.5px;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
  }
  .result::-webkit-scrollbar { display: none; }
  .result.small { font-size: 44px; }
  .result.tiny { font-size: 34px; }
  .calc.scientific .result { font-size: 46px; }
  .calc.scientific .result.small { font-size: 38px; }
  .calc.scientific .result.tiny { font-size: 30px; }
  .calc.scientific .expression { font-size: 18px; min-height: 22px; }

  .sci-toggle {
    margin: 0 8px 8px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 22px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255,255,255,0.12);
    font-size: 13px; font-weight: 500; opacity: 0.85;
    cursor: pointer; user-select: none;
  }
  .sci-toggle .arrow { display: inline-block; margin-left: 6px; transition: transform 0.3s; }
  .calc.scientific .sci-toggle .arrow { transform: rotate(180deg); }

  .scientific-pad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 0 8px;
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 0.35s ease, opacity 0.25s ease, margin 0.35s ease;
    margin-bottom: 0;
  }
  .calc.scientific .scientific-pad {
    max-height: 240px; opacity: 1; margin-bottom: 6px;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 0 8px;
  }
  .calc.scientific .keypad { gap: 8px; }
  .calc.scientific .keypad .btn { height: 54px; font-size: 25px; }
  .calc.scientific .keypad .btn.op { font-size: 29px; }

  .btn {
    height: 64px;
    border-radius: 50%;
    border: 0.5px solid rgba(255,255,255,0.18);
    font-size: 28px; font-weight: 400;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s ease, background 0.15s ease, filter 0.15s ease;
    user-select: none; position: relative;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    background: rgba(60, 60, 67, 0.45);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 1px 2px rgba(0,0,0,0.2);
  }
  .btn:active { transform: scale(0.94); filter: brightness(1.3); }

  .btn.func {
    background: rgba(165, 165, 165, 0.55);
    color: #000;
    font-weight: 500;
  }
  .btn.func:active { background: rgba(220, 220, 220, 0.85); }

  .btn.op {
    background: rgba(255, 149, 0, 0.85);
    color: #fff; font-size: 32px; font-weight: 400;
  }
  .btn.op.active {
    background: rgba(255, 255, 255, 0.95); color: #ff9500;
  }
  .btn.op:active { filter: brightness(1.2); }

  .btn.zero { grid-column: span 1; }

  .scientific-pad .btn {
    height: 42px; font-size: 15px; font-weight: 400;
    background: rgba(45, 45, 50, 0.5);
  }
  .scientific-pad .btn.active2nd { background: rgba(255, 149, 0, 0.7); }

  .sup { font-size: 0.65em; vertical-align: super; }
  .sub { font-size: 0.65em; vertical-align: sub; }

  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: #fff; border-radius: 3px; opacity: 0.9;
  }

  .menu-popover {
    position: absolute; top: 100px; right: 18px;
    width: 200px; padding: 6px;
    background: rgba(50, 50, 55, 0.7);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 14px; z-index: 200;
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .menu-popover.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .menu-item {
    padding: 10px 12px; border-radius: 8px;
    font-size: 15px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .menu-item:hover { background: rgba(255,255,255,0.08); }
  .menu-item .check { opacity: 0; }
  .menu-item.active .check { opacity: 1; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="status-bar">
    <span id="clock">9:41</span>
    <div class="icons">
      <svg viewBox="0 0 18 12" fill="white"><path d="M1,8 h2 v3 h-2 z M5,6 h2 v5 h-2 z M9,4 h2 v7 h-2 z M13,2 h2 v9 h-2 z"/></svg>
      <svg viewBox="0 0 18 12" fill="white"><path d="M9,2 C5,2 2,5 2,9 L4,9 C4,6 6,4 9,4 C12,4 14,6 14,9 L16,9 C16,5 13,2 9,2 Z M9,6 C7,6 5,7 5,9 L7,9 C7,8 8,8 9,8 C10,8 11,8 11,9 L13,9 C13,7 11,6 9,6 Z M9,9 a1,1 0 0 0 0,2 a1,1 0 0 0 0,-2 Z"/></svg>
      <svg viewBox="0 0 25 12" fill="none" stroke="white" stroke-width="1"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="white"/><rect x="22.5" y="3.5" width="1.5" height="5" rx="0.5" fill="white"/></svg>
    </div>
  </div>

  <div class="calc" id="calc">
    <div class="header">
      <div class="title">Калькулятор</div>
      <div class="menu-btn" id="menuBtn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="white">
          <circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="11" cy="7" r="1.3"/>
        </svg>
      </div>
    </div>

    <div class="menu-popover" id="menu">
      <div class="menu-item active" data-mode="basic">
        <span>Основной</span>
        <span class="check">✓</span>
      </div>
      <div class="menu-item" data-mode="scientific">
        <span>Научный</span>
        <span class="check">✓</span>
      </div>
    </div>

    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="sci-toggle" id="sciToggle">
      <span id="sciToggleText">Научные функции</span>
      <span class="arrow">▼</span>
    </div>

    <div class="scientific-pad" id="sciPad">
      <button class="btn" data-act="sinh">sinh</button>
      <button class="btn" data-act="cosh">cosh</button>
      <button class="btn" data-act="mc">mc</button>
      <button class="btn" data-act="m+">m+</button>
      <button class="btn" data-act="m-">m-</button>

      <button class="btn" data-act="2nd" id="btn2nd">2<span class="sup">nd</span></button>
      <button class="btn" data-act="square">x<span class="sup">2</span></button>
      <button class="btn" data-act="cube">x<span class="sup">3</span></button>
      <button class="btn" data-act="pow">x<span class="sup">y</span></button>
      <button class="btn" data-act="exp">e<span class="sup">x</span></button>

      <button class="btn" data-act="ten-pow">10<span class="sup">x</span></button>
      <button class="btn" data-act="recip">1/x</button>
      <button class="btn" data-act="sqrt">²√x</button>
      <button class="btn" data-act="cbrt">³√x</button>
      <button class="btn" data-act="ln">ln</button>

      <button class="btn" data-act="log10">log<span class="sub">10</span></button>
      <button class="btn" data-act="fact">x!</button>
      <button class="btn" data-act="sin" id="btnSin">sin</button>
      <button class="btn" data-act="cos" id="btnCos">cos</button>
      <button class="btn" data-act="tan" id="btnTan">tan</button>

      <button class="btn" data-act="rad" id="btnRad">Rad</button>
      <button class="btn" data-act="pi">π</button>
      <button class="btn" data-act="e">e</button>
      <button class="btn" data-act="rand">Rand</button>
      <button class="btn" data-act="mr">mr</button>
    </div>

    <div class="keypad">
      <button class="btn func" data-act="back">⌫</button>
      <button class="btn func" data-act="clear" id="clearBtn">AC</button>
      <button class="btn func" data-act="percent">%</button>
      <button class="btn op" data-op="/">÷</button>

      <button class="btn" data-num="7">7</button>
      <button class="btn" data-num="8">8</button>
      <button class="btn" data-num="9">9</button>
      <button class="btn op" data-op="*">×</button>

      <button class="btn" data-num="4">4</button>
      <button class="btn" data-num="5">5</button>
      <button class="btn" data-num="6">6</button>
      <button class="btn op" data-op="-">−</button>

      <button class="btn" data-num="1">1</button>
      <button class="btn" data-num="2">2</button>
      <button class="btn" data-num="3">3</button>
      <button class="btn op" data-op="+">+</button>

      <button class="btn func" data-act="negate">+/−</button>
      <button class="btn zero" data-num="0">0</button>
      <button class="btn" data-num=".">,</button>
      <button class="btn op" data-op="=">=</button>
    </div>
  </div>

  <div class="home-bar"></div>
</div>

<script>
const expressionEl = document.getElementById('expression');
const resultEl = document.getElementById('result');
const calcEl = document.getElementById('calc');
const menu = document.getElementById('menu');
const menuBtn = document.getElementById('menuBtn');
const sciToggle = document.getElementById('sciToggle');
const clearBtn = document.getElementById('clearBtn');
const btn2nd = document.getElementById('btn2nd');
const btnRad = document.getElementById('btnRad');
const btnSin = document.getElementById('btnSin');
const btnCos = document.getElementById('btnCos');
const btnTan = document.getElementById('btnTan');

let currentExpr = '0';
let lastExpression = '';
let firstOperand = null;
let pendingOperator = null;
let isInputtingNew = true;
let isResultShown = false;
let memory = 0;
let isSecond = false;
let isRad = false;

const updateClock = () => {
  const d = new Date();
  document.getElementById('clock').textContent =
    `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
};
updateClock();
setInterval(updateClock, 30000);

const formatNumber = (n) => {
  if (!isFinite(n)) return 'Ошибка';
  if (Number.isInteger(n) && Math.abs(n) < 1e16) return n.toLocaleString('ru-RU').replace(/,/g, ' ');
  const abs = Math.abs(n);
  if (abs !== 0 && (abs < 1e-6 || abs >= 1e16)) return n.toExponential(6);
  let s = parseFloat(n.toPrecision(12)).toString();
  if (s.includes('.')) {
    const [intPart, decPart] = s.split('.');
    return Number(intPart).toLocaleString('ru-RU').replace(/,/g, ' ') + ',' + decPart;
  }
  return Number(s).toLocaleString('ru-RU').replace(/,/g, ' ');
};

const opSymbol = (op) => ({ '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' }[op] || op);

const parseDisplay = (s) => parseFloat(s.replace(/\s/g, '').replace(',', '.'));

const compute = (a, b, op) => {
  if (op === '+') return a + b;
  if (op === '-') return a - b;
  if (op === '*') return a * b;
  if (op === '/') return b === 0 ? NaN : a / b;
  if (op === '^') return Math.pow(a, b);
  return b;
};

// последний "кусок" после оператора — это текущее число, которое мы редактируем
const getLastNumber = () => {
  const m = currentExpr.match(/(-?[\d,]+)$/);
  return m ? m[1] : '';
};

// заменить последнее число в currentExpr
const replaceLastNumber = (newNum) => {
  const last = getLastNumber();
  if (last) currentExpr = currentExpr.slice(0, -last.length) + newNum;
  else currentExpr += newNum;
};

const endsWithOperator = () => / [+−×÷^] $/.test(currentExpr);

const updateDisplay = () => {
  expressionEl.textContent = lastExpression;
  resultEl.textContent = currentExpr;
  resultEl.classList.remove('small', 'tiny');
  const len = currentExpr.length;
  if (len > 11) resultEl.classList.add('small');
  if (len > 16) resultEl.classList.add('tiny');
  clearBtn.textContent = (currentExpr !== '0' || lastExpression) ? 'C' : 'AC';

  document.querySelectorAll('.btn.op').forEach(b => b.classList.remove('active'));
  if (pendingOperator && endsWithOperator()) {
    const opBtn = document.querySelector(`.btn.op[data-op="${pendingOperator}"]`);
    if (opBtn) opBtn.classList.add('active');
  }

  // прокрутка к правому краю чтобы хвост был виден
  requestAnimationFrame(() => {
    resultEl.scrollLeft = resultEl.scrollWidth;
    expressionEl.scrollLeft = expressionEl.scrollWidth;
  });
};

const inputNum = (n) => {
  if (isResultShown) {
    currentExpr = (n === '.') ? '0,' : n;
    lastExpression = '';
    firstOperand = null;
    pendingOperator = null;
    isResultShown = false;
    isInputtingNew = false;
    updateDisplay();
    return;
  }

  if (isInputtingNew) {
    // первый ввод - заменяем затравочный '0' (или дописываем после оператора)
    if (currentExpr === '0') {
      currentExpr = (n === '.') ? '0,' : n;
    } else if (currentExpr === '-0') {
      currentExpr = (n === '.') ? '-0,' : '-' + n;
    } else {
      // после оператора: currentExpr заканчивается на ' op '
      currentExpr += (n === '.') ? '0,' : n;
    }
    isInputtingNew = false;
  } else {
    const last = getLastNumber();
    if (n === '.') {
      if (last.includes(',')) return;
      currentExpr += ',';
    } else {
      if (last === '0') replaceLastNumber(n);
      else if (last === '-0') replaceLastNumber('-' + n);
      else currentExpr += n;
    }
  }
  updateDisplay();
};

const inputOp = (op) => {
  if (op === '=') {
    if (pendingOperator !== null && firstOperand !== null && !isInputtingNew) {
      const last = getLastNumber();
      const b = parseDisplay(last);
      const result = compute(firstOperand, b, pendingOperator);
      lastExpression = currentExpr.trim() + ' =';
      currentExpr = formatNumber(result);
      firstOperand = null;
      pendingOperator = null;
      isResultShown = true;
      isInputtingNew = true;
    }
    updateDisplay();
    return;
  }

  // если только что был результат - продолжаем с него
  if (isResultShown) {
    currentExpr = currentExpr + ' ' + opSymbol(op) + ' ';
    firstOperand = parseDisplay(currentExpr);
    pendingOperator = op;
    lastExpression = '';
    isResultShown = false;
    isInputtingNew = true;
    updateDisplay();
    return;
  }

  // если уже стоит оператор в конце - заменяем его
  if (endsWithOperator()) {
    currentExpr = currentExpr.slice(0, -3) + ' ' + opSymbol(op) + ' ';
    pendingOperator = op;
    updateDisplay();
    return;
  }

  // первое число + оператор
  if (firstOperand === null) {
    firstOperand = parseDisplay(getLastNumber());
    currentExpr += ' ' + opSymbol(op) + ' ';
    pendingOperator = op;
    isInputtingNew = true;
    updateDisplay();
    return;
  }

  // уже было a OP b, нажали ещё оператор - вычисляем промежуточный результат
  const b = parseDisplay(getLastNumber());
  const result = compute(firstOperand, b, pendingOperator);
  lastExpression = currentExpr.trim();
  currentExpr = formatNumber(result) + ' ' + opSymbol(op) + ' ';
  firstOperand = result;
  pendingOperator = op;
  isInputtingNew = true;
  updateDisplay();
};

const clearAll = () => {
  currentExpr = '0';
  lastExpression = '';
  firstOperand = null;
  pendingOperator = null;
  isResultShown = false;
  isInputtingNew = true;
  updateDisplay();
};

const clearEntry = () => {
  if (isResultShown) { clearAll(); return; }
  const last = getLastNumber();
  // если последнее число уже 0 - значит C нажали повторно, делаем полный сброс
  if (last === '0' || last === '-0' || !last) { clearAll(); return; }
  // первое нажатие C - сбрасываем только текущее число
  replaceLastNumber('0');
  isInputtingNew = true;
  updateDisplay();
};

const backspace = () => {
  if (isResultShown) { clearAll(); return; }
  if (endsWithOperator()) return;
  const last = getLastNumber();
  if (!last) return;
  if (last.length <= 1 || (last.length === 2 && last.startsWith('-'))) {
    // последняя цифра - заменяем на 0
    if (currentExpr.length === last.length) {
      // это всё содержимое - сброс на затравочный 0
      currentExpr = '0';
      isInputtingNew = true;
    } else {
      // после оператора - оставляем 0 как новое число
      replaceLastNumber('0');
      isInputtingNew = true;
    }
  } else {
    currentExpr = currentExpr.slice(0, -1);
  }
  updateDisplay();
};

const negate = () => {
  if (isResultShown) {
    const v = -parseDisplay(currentExpr);
    currentExpr = formatNumber(v);
    updateDisplay();
    return;
  }
  // если только что был оператор и нового числа нет - готовим '-0'
  if (isInputtingNew && endsWithOperator()) {
    currentExpr += '-0';
    isInputtingNew = false;
    updateDisplay();
    return;
  }
  const last = getLastNumber();
  if (!last) return;
  // 0 тоже инвертируем - чтобы готовый минус стоял для следующей цифры
  let newLast;
  if (last.startsWith('-')) newLast = last.slice(1);
  else newLast = '-' + last;
  replaceLastNumber(newLast);
  updateDisplay();
};

const applyPercent = () => {
  if (isInputtingNew || endsWithOperator()) return;
  const last = getLastNumber();
  const v = parseDisplay(last);
  let result;
  if (firstOperand !== null && (pendingOperator === '+' || pendingOperator === '-')) {
    result = firstOperand * v / 100;
  } else {
    result = v / 100;
  }
  replaceLastNumber(formatNumber(result));
  updateDisplay();
};

const applyUnary = (fn, label) => {
  const last = getLastNumber();
  if (!last) return;
  const v = parseDisplay(last);
  const result = fn(v);
  if (!isFinite(result)) {
    currentExpr = 'Ошибка';
    isInputtingNew = true;
    isResultShown = true;
    updateDisplay();
    return;
  }
  // в сером поле показываем что было применено
  lastExpression = `${label}(${formatNumber(v)})`;
  currentExpr = formatNumber(result);
  firstOperand = null;
  pendingOperator = null;
  isInputtingNew = true;
  isResultShown = true;
  updateDisplay();
};

const trig = (fn, x) => fn(isRad ? x : x * Math.PI / 180);
const atrig = (fn, x) => isRad ? fn(x) : fn(x) * 180 / Math.PI;

const factorial = (n) => {
  if (n < 0 || !Number.isInteger(n) || n > 170) return NaN;
  let r = 1;
  for (let k = 2; k <= n; k++) r *= k;
  return r;
};

const insertConst = (val) => {
  if (isResultShown) {
    currentExpr = formatNumber(val);
    lastExpression = '';
    isResultShown = false;
    isInputtingNew = false;
  } else if (isInputtingNew) {
    currentExpr += formatNumber(val);
    isInputtingNew = false;
  } else {
    replaceLastNumber(formatNumber(val));
  }
  updateDisplay();
};

const sciActions = {
  'sinh': () => applyUnary(x => isSecond ? Math.asinh(x) : Math.sinh(x), isSecond ? 'asinh' : 'sinh'),
  'cosh': () => applyUnary(x => isSecond ? Math.acosh(x) : Math.cosh(x), isSecond ? 'acosh' : 'cosh'),
  'mc': () => { memory = 0; },
  'm+': () => { const last = getLastNumber(); if (last) memory += parseDisplay(last); },
  'm-': () => { const last = getLastNumber(); if (last) memory -= parseDisplay(last); },
  'mr': () => insertConst(memory),
  '2nd': () => {
    isSecond = !isSecond;
    btn2nd.classList.toggle('active2nd', isSecond);
    btnSin.innerHTML = isSecond ? 'sin<span class="sup">-1</span>' : 'sin';
    btnCos.innerHTML = isSecond ? 'cos<span class="sup">-1</span>' : 'cos';
    btnTan.innerHTML = isSecond ? 'tan<span class="sup">-1</span>' : 'tan';
  },
  'square': () => applyUnary(x => x * x, 'sqr'),
  'cube': () => applyUnary(x => x * x * x, 'cube'),
  'pow': () => inputOp('^'),
  'exp': () => applyUnary(Math.exp, 'exp'),
  'ten-pow': () => applyUnary(x => Math.pow(10, x), '10^'),
  'recip': () => applyUnary(x => 1 / x, '1/'),
  'sqrt': () => applyUnary(Math.sqrt, '√'),
  'cbrt': () => applyUnary(Math.cbrt, '∛'),
  'ln': () => applyUnary(Math.log, 'ln'),
  'log10': () => applyUnary(Math.log10, 'log'),
  'fact': () => applyUnary(factorial, 'fact'),
  'sin': () => applyUnary(x => isSecond ? atrig(Math.asin, x) : trig(Math.sin, x), isSecond ? 'asin' : 'sin'),
  'cos': () => applyUnary(x => isSecond ? atrig(Math.acos, x) : trig(Math.cos, x), isSecond ? 'acos' : 'cos'),
  'tan': () => applyUnary(x => isSecond ? atrig(Math.atan, x) : trig(Math.tan, x), isSecond ? 'atan' : 'tan'),
  'rad': () => {
    isRad = !isRad;
    btnRad.textContent = isRad ? 'Deg' : 'Rad';
  },
  'pi': () => insertConst(Math.PI),
  'e': () => insertConst(Math.E),
  'rand': () => insertConst(Math.random()),
};

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const num = btn.dataset.num;
    const op = btn.dataset.op;
    const act = btn.dataset.act;
    if (num !== undefined) inputNum(num);
    else if (op !== undefined) inputOp(op);
    else if (act === 'clear') {
      if (currentExpr !== '0' || lastExpression) clearEntry();
      else clearAll();
    }
    else if (act === 'back') backspace();
    else if (act === 'percent') applyPercent();
    else if (act === 'negate') negate();
    else if (sciActions[act]) sciActions[act]();
  });
});

menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', () => menu.classList.remove('open'));

document.querySelectorAll('.menu-item').forEach(item => {
  item.addEventListener('click', () => {
    const mode = item.dataset.mode;
    document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    calcEl.classList.toggle('scientific', mode === 'scientific');
    menu.classList.remove('open');
  });
});

sciToggle.addEventListener('click', () => {
  calcEl.classList.toggle('scientific');
  document.querySelectorAll('.menu-item').forEach(i => {
    i.classList.toggle('active', i.dataset.mode === (calcEl.classList.contains('scientific') ? 'scientific' : 'basic'));
  });
});

document.addEventListener('keydown', (e) => {
  if (/^\d$/.test(e.key)) inputNum(e.key);
  else if (e.key === '.' || e.key === ',') inputNum('.');
  else if (['+','-','*','/'].includes(e.key)) inputOp(e.key);
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); inputOp('='); }
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === '%') applyPercent();
});

updateDisplay();
</script>
</body>
</html>
