<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Calculator iOS 26</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --cell: 56px;
    --sci-cell: 38px;
    --result-fz: 56px;
    --expr-fz: 22px;
    --gap: 10px;
    --sci-gap: 6px;
    --radius: 26px;
  }

  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    background: transparent !important;
    color: #fff;
    user-select: none;
  }

  /* основной контейнер-«стекло» — рисует скруглённый прямоугольник; всё что вне него прозрачно (transparent: true в окне) */
  .app-shell {
    position: fixed; inset: 0;
    border-radius: var(--radius);
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 10%, #ff6b9d 0%, transparent 35%),
      radial-gradient(circle at 80% 20%, #4facfe 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, #ff9a56 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #a78bfa 0%, transparent 35%),
      #1a0a2e;
    /* inset highlights для эффекта фаски + тонкая внешняя тень */
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.18),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -1px 0 rgba(0,0,0,0.35);
  }
  /* кольцо-фаска чтобы скругление было визуально подчёркнуто */
  .app-shell::before {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    border-radius: var(--radius);
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,0.25),
      inset 0 0 12px rgba(255,255,255,0.06);
    z-index: 250;
  }

  /* окно перетаскивается за header, кнопки и интерактивные элементы — нет */
  .drag { -webkit-app-region: drag; }
  .no-drag { -webkit-app-region: no-drag; }

  /* отдельная drag-зона — занимает ТОЛЬКО левую часть top-bar, НЕ перекрывая win-controls */
  .drag-zone {
    position: absolute;
    top: 0; left: 0;
    height: 38px;
    /* справа резерв 80px под win-controls (10 right + 26+6+26 ширина + 12 запас) */
    right: 80px;
    -webkit-app-region: drag;
    z-index: 1;
  }

  .calc {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 8px 10px 14px;
  }

  /* системные кнопки (свернуть / закрыть) — поверх всего */
  .win-controls {
    position: absolute;
    top: 8px; right: 10px;
    display: flex; gap: 6px;
    z-index: 1000;
    -webkit-app-region: no-drag;
    pointer-events: auto;
  }
  .win-btn {
    width: 26px; height: 26px;
    border-radius: 50%;
    border: 0.5px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1;
    transition: background 0.15s ease;
    -webkit-app-region: no-drag;
    pointer-events: auto;
    padding: 0;
    outline: none;
  }
  .win-btn svg { pointer-events: none; }
  .win-btn:hover { background: rgba(255,255,255,0.22); }
  .win-btn.close:hover { background: rgba(255, 80, 80, 0.85); }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 10px 4px 14px;
    height: 38px;
    flex-shrink: 0;
    /* отступ справа чтобы не наезжать на оконные кнопки */
    padding-right: 80px;
    position: relative;
    z-index: 5;
    /* НЕ drag — drag-зона в отдельном .drag-zone элементе */
  }
  .header .title { font-size: 16px; font-weight: 600; opacity: 0.95; }
  .header .menu-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: 0.5px solid rgba(255,255,255,0.2);
  }

  .display {
    flex: 1;
    min-height: var(--min-display, 140px);
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: flex-end;
    padding: 0 16px 6px;
    overflow: hidden;
  }
  .calc.scientific .display { min-height: var(--min-display, 110px); }
  .expression {
    font-size: var(--expr-fz);
    font-weight: 300; opacity: 0.65;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    margin-bottom: 2px; min-height: 1.2em; line-height: 1.2;
    text-align: right;
    flex-shrink: 0;
  }
  .expression::-webkit-scrollbar { display: none; }
  .result {
    font-size: var(--result-fz);
    font-weight: 300; line-height: 1.05;
    letter-spacing: -1.5px;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
    flex-shrink: 0;
  }
  .result::-webkit-scrollbar { display: none; }
  /* курсор-«хваталка» когда контент длиннее видимой области */
  .scrollable-x.overflowing { cursor: grab; }
  .scrollable-x.overflowing.dragging { cursor: grabbing; }
  .result.small { font-size: calc(var(--result-fz) * 0.78); }
  .result.tiny  { font-size: calc(var(--result-fz) * 0.62); }

  .sci-toggle {
    margin: 0 10px 6px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 18px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 0.5px solid rgba(255,255,255,0.12);
    font-size: 12px; font-weight: 500; opacity: 0.85;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sci-toggle .arrow { display: inline-block; margin-left: 6px; transition: transform 0.3s; }
  .calc.scientific .sci-toggle .arrow { transform: rotate(180deg); }

  .scientific-pad {
    display: none;
    grid-template-columns: repeat(5, var(--sci-cell));
    grid-auto-rows: var(--sci-cell);
    gap: var(--sci-gap);
    justify-content: center;
    padding: 0 10px;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .calc.scientific .scientific-pad { display: grid; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, var(--cell));
    grid-auto-rows: var(--cell);
    gap: var(--gap);
    justify-content: center;
    padding: 0 10px;
    flex-shrink: 0;
  }

  .btn {
    width: 100%; height: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 0.5px solid rgba(255,255,255,0.18);
    font-size: calc(var(--cell) * 0.42);
    font-weight: 400;
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.08s ease, background 0.15s ease, filter 0.15s ease;
    position: relative;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    background: rgba(60, 60, 67, 0.45);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 1px 2px rgba(0,0,0,0.2);
    padding: 0;
  }
  .btn:active { transform: scale(0.94); filter: brightness(1.3); }

  .btn.func {
    background: rgba(165, 165, 165, 0.55);
    color: #000;
    font-weight: 500;
  }
  .btn.func:active { background: rgba(220, 220, 220, 0.85); }

  .btn.op {
    background: rgba(255, 149, 0, 0.85);
    color: #fff; font-size: calc(var(--cell) * 0.5);
    font-weight: 400;
  }
  .btn.op.active {
    background: rgba(255, 255, 255, 0.95); color: #ff9500;
  }
  .btn.op:active { filter: brightness(1.2); }

  .scientific-pad .btn {
    font-size: calc(var(--sci-cell) * 0.36);
    font-weight: 400;
    background: rgba(45, 45, 50, 0.5);
  }
  .scientific-pad .btn.active2nd { background: rgba(255, 149, 0, 0.7); }

  .sup { font-size: 0.65em; vertical-align: super; }
  .sub { font-size: 0.65em; vertical-align: sub; }

  .menu-popover {
    position: absolute; top: 44px; right: 14px;
    width: 200px; padding: 6px;
    background: rgba(50, 50, 55, 0.7);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 14px; z-index: 200;
    opacity: 0; pointer-events: none; transform: translateY(-8px);
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .menu-popover.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .menu-item {
    padding: 10px 12px; border-radius: 8px;
    font-size: 15px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
  }
  .menu-item:hover { background: rgba(255,255,255,0.08); }
  .menu-item .check { opacity: 0; }
  .menu-item.active .check { opacity: 1; }

  /* ===== ПАНЕЛЬ ИСТОРИИ ===== */
  .history-panel {
    position: absolute; inset: 0;
    border-radius: var(--radius);
    background:
      radial-gradient(circle at 20% 10%, #ff6b9d 0%, transparent 35%),
      radial-gradient(circle at 80% 20%, #4facfe 0%, transparent 40%),
      radial-gradient(circle at 50% 80%, #ff9a56 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, #a78bfa 0%, transparent 35%),
      #1a0a2e;
    z-index: 400;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .history-panel.open { display: flex; }
  .history-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 14px;
    /* отступ справа от win-controls */
    padding-right: 80px;
    height: 46px;
    flex-shrink: 0;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
  }
  .history-panel-title { font-size: 17px; font-weight: 600; }
  .history-back-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 0.5px solid rgba(255,255,255,0.18);
    color: #fff; font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .history-back-btn:hover { background: rgba(255,255,255,0.22); }
  .history-clear-btn {
    background: transparent;
    border: none;
    color: #ff9500;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .history-clear-btn:hover { background: rgba(255,149,0,0.15); }
  .history-clear-btn:disabled { opacity: 0.35; cursor: default; }
  .history-clear-btn:disabled:hover { background: transparent; }
  .history-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 14px 14px;
  }
  .history-list::-webkit-scrollbar { width: 6px; }
  .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  .history-item {
    padding: 12px 10px;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
    cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 4px;
    transition: background 0.12s ease;
    border-radius: 8px;
  }
  .history-item:hover { background: rgba(255,255,255,0.06); }
  .history-item:active { background: rgba(255,255,255,0.12); }
  .history-item .h-expr {
    font-size: 14px; opacity: 0.55;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
  }
  .history-item .h-result {
    font-size: 26px; font-weight: 300;
    letter-spacing: -0.5px;
    max-width: 100%; overflow-x: auto; white-space: nowrap;
    text-align: right;
  }
  .history-item .h-expr::-webkit-scrollbar,
  .history-item .h-result::-webkit-scrollbar { display: none; }
  .history-empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.4;
    font-size: 15px;
    padding: 30px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="app-shell">

<div class="win-controls no-drag">
  <button type="button" class="win-btn" id="winMin" title="Свернуть">
    <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="white" stroke-width="1.5"/></svg>
  </button>
  <button type="button" class="win-btn close" id="winClose" title="Закрыть">
    <svg width="10" height="10" viewBox="0 0 10 10"><line x1="2" y1="2" x2="8" y2="8" stroke="white" stroke-width="1.5"/><line x1="8" y1="2" x2="2" y2="8" stroke="white" stroke-width="1.5"/></svg>
  </button>
</div>

<div class="calc" id="calc">
  <div class="drag-zone"></div>
  <div class="header">
    <div class="title">Калькулятор</div>
    <div class="menu-btn no-drag" id="menuBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="white">
        <circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="11" cy="7" r="1.3"/>
      </svg>
    </div>
  </div>

  <div class="menu-popover no-drag" id="menu">
    <div class="menu-item active" data-mode="basic">
      <span>Основной</span>
      <span class="check">✓</span>
    </div>
    <div class="menu-item" data-mode="scientific">
      <span>Научный</span>
      <span class="check">✓</span>
    </div>
    <div class="menu-item" data-action="history">
      <span>История</span>
      <span style="opacity:0.5">›</span>
    </div>
  </div>

  <div class="display no-drag">
    <div class="expression scrollable-x" id="expression"></div>
    <div class="result scrollable-x" id="result">0</div>
  </div>

  <div class="sci-toggle no-drag" id="sciToggle">
    <span id="sciToggleText">Научные функции</span>
    <span class="arrow">▼</span>
  </div>

  <div class="scientific-pad no-drag" id="sciPad">
    <button class="btn" data-act="sinh">sinh</button>
    <button class="btn" data-act="cosh">cosh</button>
    <button class="btn" data-act="mc">mc</button>
    <button class="btn" data-act="m+">m+</button>
    <button class="btn" data-act="m-">m-</button>

    <button class="btn" data-act="2nd" id="btn2nd">2<span class="sup">nd</span></button>
    <button class="btn" data-act="square">x<span class="sup">2</span></button>
    <button class="btn" data-act="cube">x<span class="sup">3</span></button>
    <button class="btn" data-act="pow">x<span class="sup">y</span></button>
    <button class="btn" data-act="exp">e<span class="sup">x</span></button>

    <button class="btn" data-act="ten-pow">10<span class="sup">x</span></button>
    <button class="btn" data-act="recip">1/x</button>
    <button class="btn" data-act="sqrt">²√x</button>
    <button class="btn" data-act="cbrt">³√x</button>
    <button class="btn" data-act="ln">ln</button>

    <button class="btn" data-act="log10">log<span class="sub">10</span></button>
    <button class="btn" data-act="fact">x!</button>
    <button class="btn" data-act="sin" id="btnSin">sin</button>
    <button class="btn" data-act="cos" id="btnCos">cos</button>
    <button class="btn" data-act="tan" id="btnTan">tan</button>

    <button class="btn" data-act="rad" id="btnRad">Rad</button>
    <button class="btn" data-act="pi">π</button>
    <button class="btn" data-act="e">e</button>
    <button class="btn" data-act="rand">Rand</button>
    <button class="btn" data-act="mr">mr</button>
  </div>

  <div class="keypad no-drag" id="keypad">
    <button class="btn func" data-act="back">⌫</button>
    <button class="btn func" data-act="clear" id="clearBtn">AC</button>
    <button class="btn func" data-act="percent">%</button>
    <button class="btn op" data-op="/">÷</button>

    <button class="btn" data-num="7">7</button>
    <button class="btn" data-num="8">8</button>
    <button class="btn" data-num="9">9</button>
    <button class="btn op" data-op="*">×</button>

    <button class="btn" data-num="4">4</button>
    <button class="btn" data-num="5">5</button>
    <button class="btn" data-num="6">6</button>
    <button class="btn op" data-op="-">−</button>

    <button class="btn" data-num="1">1</button>
    <button class="btn" data-num="2">2</button>
    <button class="btn" data-num="3">3</button>
    <button class="btn op" data-op="+">+</button>

    <button class="btn func" data-act="negate">+/−</button>
    <button class="btn" data-num="0">0</button>
    <button class="btn" data-num=".">,</button>
    <button class="btn op" data-op="=">=</button>
  </div>
</div>

<div class="history-panel" id="historyPanel">
  <div class="history-panel-header">
    <button type="button" class="history-back-btn no-drag" id="historyBack" title="Назад">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,2 3,7 9,12"/></svg>
    </button>
    <div class="history-panel-title">История</div>
    <button type="button" class="history-clear-btn no-drag" id="historyClear">Очистить</button>
  </div>
  <div class="history-list" id="historyList"></div>
</div>

</div><!-- /.app-shell -->

<script>
// ====== ОКОННЫЕ КНОПКИ ======
// nodeIntegration: true в main.js → можем напрямую require('electron').
// Это самая надёжная схема для локального десктоп-приложения.
let _ipc = null;
try {
  _ipc = require('electron').ipcRenderer;
} catch (e) {
  console.error('Cannot load electron ipcRenderer:', e);
}

function sendIPC(channel) {
  if (_ipc) {
    try { _ipc.send(channel); return; } catch (e) { console.error('ipc send failed', channel, e); }
  }
  console.warn('IPC unavailable, channel:', channel);
}

const winMinBtn = document.getElementById('winMin');
const winCloseBtn = document.getElementById('winClose');

// слушатели по нескольким событиям + явный stopPropagation
['click', 'mousedown'].forEach(evt => {
  winMinBtn.addEventListener(evt, (e) => {
    if (evt === 'click') { e.preventDefault(); e.stopPropagation(); sendIPC('window-minimize'); }
  });
  winCloseBtn.addEventListener(evt, (e) => {
    if (evt === 'click') { e.preventDefault(); e.stopPropagation(); sendIPC('window-close'); }
  });
});

// ====== АДАПТИВНЫЙ РАСЧЁТ РАЗМЕРА КНОПОК ======
// Кнопки должны оставаться круглыми всегда, не сжиматься по Y.
// Подбираем cell-size = min((доступная_ширина - gaps)/cols, (доступная_высота - gaps)/rows).
const calcEl = document.getElementById('calc');
const sciToggleEl = document.getElementById('sciToggle');

// фиксированный минимум под display — кнопки никогда не растут за его счёт
const MIN_DISPLAY_BASIC = 140;
const MIN_DISPLAY_SCI = 110;

function fit() {
  const isSci = calcEl.classList.contains('scientific');
  const totalW = calcEl.clientWidth;
  const totalH = calcEl.clientHeight;

  const padX = 20, padY = 22;
  const gap = 10, sciGap = 6;
  const sideKeypadPad = 20;
  const headerH = 38;
  const sciToggleH = 32 + 6;

  const MIN_DISPLAY = isSci ? MIN_DISPLAY_SCI : MIN_DISPLAY_BASIC;

  const widthForKeypad = totalW - padX - sideKeypadPad;
  const cellByWidth = Math.floor((widthForKeypad - 3 * gap) / 4);

  // sci-pad занимает по горизонтали РОВНО ту же ширину что и основная клавиатура:
  //   5 * sciCell + 4 * sciGap  ==  4 * cell + 3 * gap
  // ⇒ sciCell = (4*cell + 3*gap - 4*sciGap) / 5
  const sciCellFromCell = (c) => Math.floor((4 * c + 3 * gap - 4 * sciGap) / 5);

  // высота, оставшаяся на клавиатуру + sci-pad ПОСЛЕ резервации display
  const remainingH = totalH - padY - headerH - sciToggleH - MIN_DISPLAY;

  let cellByHeight;
  if (isSci) {
    // sci_h = 5*sciCell + 4*sciGap + 6 (margin) = (4*cell+6) + 24 + 6 = 4*cell + 36
    // keypad_h = 5*cell + 4*gap = 5*cell + 40
    // remainingH = 9*cell + 76  ⇒  cell = (remainingH - 76) / 9
    cellByHeight = Math.floor((remainingH - 76) / 9);
  } else {
    cellByHeight = Math.floor((remainingH - 40) / 5);
  }

  const cell = Math.max(34, Math.min(cellByWidth, cellByHeight));
  const sciCell = isSci ? sciCellFromCell(cell) : sciCellFromCell(cell);

  // фактическая высота display после раскладки (>= MIN_DISPLAY гарантировано)
  const sciH = isSci ? 5 * sciCell + 4 * sciGap + 6 : 0;
  const keypadH = 5 * cell + 4 * gap;
  const actualDisplayH = totalH - padY - headerH - sciToggleH - keypadH - sciH;

  const exprFz = Math.max(13, Math.min(isSci ? 18 : 22, Math.floor(actualDisplayH * 0.18)));
  const resultByDisplay = Math.max(28, Math.floor((actualDisplayH - exprFz - 10) * 0.88));
  const resultByCell = Math.floor(cell * (isSci ? 0.85 : 0.95));
  const resultFz = Math.min(72, Math.max(28, Math.min(resultByDisplay, resultByCell)));

  document.documentElement.style.setProperty('--cell', cell + 'px');
  document.documentElement.style.setProperty('--sci-cell', sciCell + 'px');
  document.documentElement.style.setProperty('--result-fz', resultFz + 'px');
  document.documentElement.style.setProperty('--expr-fz', exprFz + 'px');
  document.documentElement.style.setProperty('--min-display', MIN_DISPLAY + 'px');
}

const ro = new ResizeObserver(fit);
ro.observe(document.body);
window.addEventListener('load', fit);

// ====== ЛОГИКА КАЛЬКУЛЯТОРА (без изменений из оригинала) ======
const expressionEl = document.getElementById('expression');
const resultEl = document.getElementById('result');
const calcRoot = calcEl;
const menu = document.getElementById('menu');
const menuBtn = document.getElementById('menuBtn');
const sciToggle = sciToggleEl;
const clearBtn = document.getElementById('clearBtn');
const btn2nd = document.getElementById('btn2nd');
const btnRad = document.getElementById('btnRad');
const btnSin = document.getElementById('btnSin');
const btnCos = document.getElementById('btnCos');
const btnTan = document.getElementById('btnTan');

let currentExpr = '0';
let lastExpression = '';
let firstOperand = null;
let pendingOperator = null;
let isInputtingNew = true;
let isResultShown = false;
let memory = 0;
let isSecond = false;
let isRad = false;

const formatNumber = (n) => {
  if (!isFinite(n)) return 'Ошибка';
  if (Number.isInteger(n) && Math.abs(n) < 1e16) return n.toLocaleString('ru-RU').replace(/,/g, ' ');
  const abs = Math.abs(n);
  if (abs !== 0 && (abs < 1e-6 || abs >= 1e16)) return n.toExponential(6);
  let s = parseFloat(n.toPrecision(12)).toString();
  if (s.includes('.')) {
    const [intPart, decPart] = s.split('.');
    return Number(intPart).toLocaleString('ru-RU').replace(/,/g, ' ') + ',' + decPart;
  }
  return Number(s).toLocaleString('ru-RU').replace(/,/g, ' ');
};

const opSymbol = (op) => ({ '+': '+', '-': '−', '*': '×', '/': '÷', '^': '^' }[op] || op);
const parseDisplay = (s) => parseFloat(s.replace(/\s/g, '').replace(',', '.'));

const compute = (a, b, op) => {
  if (op === '+') return a + b;
  if (op === '-') return a - b;
  if (op === '*') return a * b;
  if (op === '/') return b === 0 ? NaN : a / b;
  if (op === '^') return Math.pow(a, b);
  return b;
};

const getLastNumber = () => {
  // Захватывает число в конце currentExpr включая разделители тысяч.
  // toLocaleString('ru-RU') ставит NBSP ( ) между тысячами,
  // а операторы обёрнуты в обычные пробелы — разница используется ниже.
  // Поддерживается обычный пробел как fallback (на случай локали без NBSP).
  // Первая альтернатива: число с разделителями тысяч ("1 234,56").
  // Вторая: число без разделителей ("12345" или "0,").
  const m = currentExpr.match(/(-?\d{1,3}(?:[  ]\d{3})+(?:,\d*)?|-?\d+(?:,\d*)?)$/);
  return m ? m[1] : '';
};

const replaceLastNumber = (newNum) => {
  const last = getLastNumber();
  if (last) currentExpr = currentExpr.slice(0, -last.length) + newNum;
  else currentExpr += newNum;
};

const endsWithOperator = () => / [+−×÷^] $/.test(currentExpr);

const updateDisplay = () => {
  expressionEl.textContent = lastExpression;
  resultEl.textContent = currentExpr;
  resultEl.classList.remove('small', 'tiny');
  const len = currentExpr.length;
  if (len > 11) resultEl.classList.add('small');
  if (len > 16) resultEl.classList.add('tiny');
  clearBtn.textContent = (currentExpr !== '0' || lastExpression) ? 'C' : 'AC';

  document.querySelectorAll('.btn.op').forEach(b => b.classList.remove('active'));
  if (pendingOperator && endsWithOperator()) {
    const opBtn = document.querySelector(`.btn.op[data-op="${pendingOperator}"]`);
    if (opBtn) opBtn.classList.add('active');
  }

  requestAnimationFrame(() => {
    resultEl.scrollLeft = resultEl.scrollWidth;
    expressionEl.scrollLeft = expressionEl.scrollWidth;
  });
};

const inputNum = (n) => {
  if (isResultShown) {
    currentExpr = (n === '.') ? '0,' : n;
    lastExpression = '';
    firstOperand = null;
    pendingOperator = null;
    isResultShown = false;
    isInputtingNew = false;
    updateDisplay();
    return;
  }

  if (isInputtingNew) {
    // смотрим на последнее число в выражении, а не на всю строку:
    // после C или ⌫ currentExpr может быть "5 + 0", и цифру надо заменить, а не дописать.
    const last = getLastNumber();
    if (last === '') {
      // только что был оператор — пишем цифру в конец
      currentExpr += (n === '.') ? '0,' : n;
    } else if (last === '0') {
      replaceLastNumber((n === '.') ? '0,' : n);
    } else if (last === '-0') {
      replaceLastNumber((n === '.') ? '-0,' : '-' + n);
    } else {
      // на всякий случай — заменяем (нормально не должно происходить)
      replaceLastNumber((n === '.') ? '0,' : n);
    }
    isInputtingNew = false;
  } else {
    const last = getLastNumber();
    if (n === '.') {
      if (last.includes(',')) return;
      currentExpr += ',';
    } else {
      if (last === '0') replaceLastNumber(n);
      else if (last === '-0') replaceLastNumber('-' + n);
      else currentExpr += n;
    }
  }
  updateDisplay();
};

const inputOp = (op) => {
  // после "Ошибка" любая клавиша оператора сначала сбрасывает состояние,
  // чтобы не получалось "Ошибка + 5".
  if (currentExpr === 'Ошибка') {
    clearAll();
    return;
  }
  if (op === '=') {
    if (pendingOperator !== null && firstOperand !== null && !isInputtingNew) {
      const last = getLastNumber();
      const b = parseDisplay(last);
      const result = compute(firstOperand, b, pendingOperator);
      const exprForHistory = currentExpr.trim();
      lastExpression = exprForHistory + ' =';
      currentExpr = formatNumber(result);
      addHistoryEntry(exprForHistory, currentExpr);
      firstOperand = null;
      pendingOperator = null;
      isResultShown = true;
      isInputtingNew = true;
    }
    updateDisplay();
    return;
  }

  if (isResultShown) {
    currentExpr = currentExpr + ' ' + opSymbol(op) + ' ';
    firstOperand = parseDisplay(currentExpr);
    pendingOperator = op;
    lastExpression = '';
    isResultShown = false;
    isInputtingNew = true;
    updateDisplay();
    return;
  }

  if (endsWithOperator()) {
    currentExpr = currentExpr.slice(0, -3) + ' ' + opSymbol(op) + ' ';
    pendingOperator = op;
    updateDisplay();
    return;
  }

  if (firstOperand === null) {
    firstOperand = parseDisplay(getLastNumber());
    currentExpr += ' ' + opSymbol(op) + ' ';
    pendingOperator = op;
    isInputtingNew = true;
    updateDisplay();
    return;
  }

  const b = parseDisplay(getLastNumber());
  const result = compute(firstOperand, b, pendingOperator);
  lastExpression = currentExpr.trim();
  currentExpr = formatNumber(result) + ' ' + opSymbol(op) + ' ';
  firstOperand = result;
  pendingOperator = op;
  isInputtingNew = true;
  updateDisplay();
};

const clearAll = () => {
  currentExpr = '0';
  lastExpression = '';
  firstOperand = null;
  pendingOperator = null;
  isResultShown = false;
  isInputtingNew = true;
  updateDisplay();
};

const clearEntry = () => {
  if (isResultShown) { clearAll(); return; }
  const last = getLastNumber();
  if (last === '0' || last === '-0' || !last) { clearAll(); return; }
  replaceLastNumber('0');
  isInputtingNew = true;
  updateDisplay();
};

const backspace = () => {
  if (isResultShown) { clearAll(); return; }
  if (endsWithOperator()) return;
  const last = getLastNumber();
  if (!last) return;
  if (last.length <= 1 || (last.length === 2 && last.startsWith('-'))) {
    if (currentExpr.length === last.length) {
      currentExpr = '0';
      isInputtingNew = true;
    } else {
      replaceLastNumber('0');
      isInputtingNew = true;
    }
  } else {
    currentExpr = currentExpr.slice(0, -1);
  }
  updateDisplay();
};

const negate = () => {
  if (isResultShown) {
    const v = -parseDisplay(currentExpr);
    currentExpr = formatNumber(v);
    updateDisplay();
    return;
  }
  if (isInputtingNew && endsWithOperator()) {
    currentExpr += '-0';
    isInputtingNew = false;
    updateDisplay();
    return;
  }
  const last = getLastNumber();
  if (!last) return;
  let newLast;
  if (last.startsWith('-')) newLast = last.slice(1);
  else newLast = '-' + last;
  replaceLastNumber(newLast);
  updateDisplay();
};

const applyPercent = () => {
  if (isInputtingNew || endsWithOperator()) return;
  const last = getLastNumber();
  const v = parseDisplay(last);
  let result;
  if (firstOperand !== null && (pendingOperator === '+' || pendingOperator === '-')) {
    result = firstOperand * v / 100;
  } else {
    result = v / 100;
  }
  replaceLastNumber(formatNumber(result));
  updateDisplay();
};

const applyUnary = (fn, label) => {
  const last = getLastNumber();
  if (!last) return;
  const v = parseDisplay(last);
  const result = fn(v);
  if (!isFinite(result)) {
    currentExpr = 'Ошибка';
    isInputtingNew = true;
    isResultShown = true;
    updateDisplay();
    return;
  }
  const exprForHistory = `${label}(${formatNumber(v)})`;
  lastExpression = exprForHistory;
  currentExpr = formatNumber(result);
  addHistoryEntry(exprForHistory, currentExpr);
  firstOperand = null;
  pendingOperator = null;
  isInputtingNew = true;
  isResultShown = true;
  updateDisplay();
};

const trig = (fn, x) => fn(isRad ? x : x * Math.PI / 180);
const atrig = (fn, x) => isRad ? fn(x) : fn(x) * 180 / Math.PI;

const factorial = (n) => {
  if (n < 0 || !Number.isInteger(n) || n > 170) return NaN;
  let r = 1;
  for (let k = 2; k <= n; k++) r *= k;
  return r;
};

const insertConst = (val) => {
  if (isResultShown) {
    currentExpr = formatNumber(val);
    lastExpression = '';
    isResultShown = false;
    isInputtingNew = false;
  } else if (isInputtingNew) {
    currentExpr += formatNumber(val);
    isInputtingNew = false;
  } else {
    replaceLastNumber(formatNumber(val));
  }
  updateDisplay();
};

const sciActions = {
  'sinh': () => applyUnary(x => isSecond ? Math.asinh(x) : Math.sinh(x), isSecond ? 'asinh' : 'sinh'),
  'cosh': () => applyUnary(x => isSecond ? Math.acosh(x) : Math.cosh(x), isSecond ? 'acosh' : 'cosh'),
  'mc': () => { memory = 0; },
  'm+': () => { const last = getLastNumber(); if (last) memory += parseDisplay(last); },
  'm-': () => { const last = getLastNumber(); if (last) memory -= parseDisplay(last); },
  'mr': () => insertConst(memory),
  '2nd': () => {
    isSecond = !isSecond;
    btn2nd.classList.toggle('active2nd', isSecond);
    btnSin.innerHTML = isSecond ? 'sin<span class="sup">-1</span>' : 'sin';
    btnCos.innerHTML = isSecond ? 'cos<span class="sup">-1</span>' : 'cos';
    btnTan.innerHTML = isSecond ? 'tan<span class="sup">-1</span>' : 'tan';
  },
  'square': () => applyUnary(x => x * x, 'sqr'),
  'cube': () => applyUnary(x => x * x * x, 'cube'),
  'pow': () => inputOp('^'),
  'exp': () => applyUnary(Math.exp, 'exp'),
  'ten-pow': () => applyUnary(x => Math.pow(10, x), '10^'),
  'recip': () => applyUnary(x => 1 / x, '1/'),
  'sqrt': () => applyUnary(Math.sqrt, '√'),
  'cbrt': () => applyUnary(Math.cbrt, '∛'),
  'ln': () => applyUnary(Math.log, 'ln'),
  'log10': () => applyUnary(Math.log10, 'log'),
  'fact': () => applyUnary(factorial, 'fact'),
  'sin': () => applyUnary(x => isSecond ? atrig(Math.asin, x) : trig(Math.sin, x), isSecond ? 'asin' : 'sin'),
  'cos': () => applyUnary(x => isSecond ? atrig(Math.acos, x) : trig(Math.cos, x), isSecond ? 'acos' : 'cos'),
  'tan': () => applyUnary(x => isSecond ? atrig(Math.atan, x) : trig(Math.tan, x), isSecond ? 'atan' : 'tan'),
  'rad': () => {
    isRad = !isRad;
    btnRad.textContent = isRad ? 'Deg' : 'Rad';
  },
  'pi': () => insertConst(Math.PI),
  'e': () => insertConst(Math.E),
  'rand': () => {
    const v = Math.random();
    insertConst(v);
    addHistoryEntry('Rand', formatNumber(v));
  },
};

document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const num = btn.dataset.num;
    const op = btn.dataset.op;
    const act = btn.dataset.act;
    if (num !== undefined) inputNum(num);
    else if (op !== undefined) inputOp(op);
    else if (act === 'clear') {
      if (currentExpr !== '0' || lastExpression) clearEntry();
      else clearAll();
    }
    else if (act === 'back') backspace();
    else if (act === 'percent') applyPercent();
    else if (act === 'negate') negate();
    else if (sciActions[act]) sciActions[act]();
  });
});

menuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  menu.classList.toggle('open');
});
document.addEventListener('click', () => menu.classList.remove('open'));

document.querySelectorAll('.menu-item').forEach(item => {
  item.addEventListener('click', () => {
    if (item.dataset.action === 'history') {
      menu.classList.remove('open');
      openHistoryPanel();
      return;
    }
    const mode = item.dataset.mode;
    if (!mode) return;
    document.querySelectorAll('.menu-item').forEach(i => {
      if (i.dataset.mode) i.classList.remove('active');
    });
    item.classList.add('active');
    calcRoot.classList.toggle('scientific', mode === 'scientific');
    menu.classList.remove('open');
    fit();
  });
});

// ===== ИСТОРИЯ РАСЧЁТОВ =====
const HISTORY_KEY = 'calc_history_v1';
const HISTORY_LIMIT = 200;
let history = [];
try {
  const raw = localStorage.getItem(HISTORY_KEY);
  if (raw) history = JSON.parse(raw);
  if (!Array.isArray(history)) history = [];
} catch (e) { history = []; }

function saveHistory() {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-HISTORY_LIMIT))); }
  catch (e) {}
}
function addHistoryEntry(expr, result) {
  if (!expr || !result || result === 'Ошибка') return;
  history.push({ expr, result, ts: Date.now() });
  if (history.length > HISTORY_LIMIT) history = history.slice(-HISTORY_LIMIT);
  saveHistory();
}

const historyPanel = document.getElementById('historyPanel');
const historyList = document.getElementById('historyList');
const historyBackBtn = document.getElementById('historyBack');
const historyClearBtn = document.getElementById('historyClear');

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderHistory() {
  if (history.length === 0) {
    historyList.innerHTML = '<div class="history-empty">История пуста.<br>Завершайте вычисления знаком =, чтобы они сохранялись здесь.</div>';
    historyClearBtn.disabled = true;
    return;
  }
  historyClearBtn.disabled = false;
  // самые свежие сверху
  historyList.innerHTML = history.slice().reverse().map((h, i) => {
    const realIdx = history.length - 1 - i;
    return `<div class="history-item" data-idx="${realIdx}">
      <div class="h-expr">${escapeHTML(h.expr)} =</div>
      <div class="h-result">${escapeHTML(h.result)}</div>
    </div>`;
  }).join('');
  historyList.querySelectorAll('.history-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = +el.dataset.idx;
      const h = history[idx];
      if (!h) return;
      // подгрузить результат как стартовое число для дальнейших вычислений
      currentExpr = h.result;
      lastExpression = h.expr + ' =';
      firstOperand = null;
      pendingOperator = null;
      isInputtingNew = true;
      isResultShown = true;
      updateDisplay();
      closeHistoryPanel();
    });
  });
}

function openHistoryPanel() {
  renderHistory();
  historyPanel.classList.add('open');
}
function closeHistoryPanel() {
  historyPanel.classList.remove('open');
}

historyBackBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  closeHistoryPanel();
});
historyClearBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  history = [];
  saveHistory();
  renderHistory();
});

sciToggle.addEventListener('click', () => {
  calcRoot.classList.toggle('scientific');
  document.querySelectorAll('.menu-item').forEach(i => {
    i.classList.toggle('active', i.dataset.mode === (calcRoot.classList.contains('scientific') ? 'scientific' : 'basic'));
  });
  fit();
});

document.addEventListener('keydown', (e) => {
  // если открыта история — Esc её закрывает, остальные клавиши игнорируются
  if (historyPanel.classList.contains('open')) {
    if (e.key === 'Escape') closeHistoryPanel();
    return;
  }
  if (/^\d$/.test(e.key)) inputNum(e.key);
  else if (e.key === '.' || e.key === ',') inputNum('.');
  else if (['+','-','*','/'].includes(e.key)) inputOp(e.key);
  else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); inputOp('='); }
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Escape') clearAll();
  else if (e.key === '%') applyPercent();
});

// ===== ГОРИЗОНТАЛЬНАЯ ПРОКРУТКА (колесом + drag) =====
function makeScrollableX(el) {
  // отметить когда контент шире окна — для cursor: grab
  const updateOverflowState = () => {
    el.classList.toggle('overflowing', el.scrollWidth > el.clientWidth + 1);
  };
  // следим за изменением размера/контента
  new ResizeObserver(updateOverflowState).observe(el);
  new MutationObserver(updateOverflowState).observe(el, { childList: true, characterData: true, subtree: true });
  setTimeout(updateOverflowState, 0);

  // колесо: вертикальный delta → горизонтальный scrollLeft
  el.addEventListener('wheel', (e) => {
    if (el.scrollWidth <= el.clientWidth) return;
    const delta = (Math.abs(e.deltaX) > Math.abs(e.deltaY)) ? e.deltaX : e.deltaY;
    if (delta === 0) return;
    e.preventDefault();
    el.scrollLeft += delta;
  }, { passive: false });

  // drag-to-scroll
  let isDown = false, startX = 0, startScroll = 0;
  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (el.scrollWidth <= el.clientWidth) return;
    isDown = true;
    startX = e.clientX;
    startScroll = el.scrollLeft;
    el.classList.add('dragging');
  });
  document.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    const dx = e.clientX - startX;
    el.scrollLeft = startScroll - dx;
    e.preventDefault();
  });
  document.addEventListener('mouseup', () => {
    if (isDown) {
      isDown = false;
      el.classList.remove('dragging');
    }
  });
}

makeScrollableX(resultEl);
makeScrollableX(expressionEl);

updateDisplay();
fit();
</script>
